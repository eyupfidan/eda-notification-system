name: eda-notification-system

# Shared settings for every container that runs the Laravel codebase.
# Values can be overridden from a local .env file or the shell environment.
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: eda-notification-system:local
  restart: unless-stopped
  environment: &app-env
    APP_NAME: "EDA Notification System"
    APP_ENV: ${APP_ENV:-local}
    # Local-development key only. Always override APP_KEY outside local environments.
    APP_KEY: ${APP_KEY:-base64:2rqo7utE7JQjqvZN6mTJsfKBm0i7v0QbY4cx1X1cO70=}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:8080}
    LOG_CHANNEL: stderr
    LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-notifications}
    DB_USERNAME: ${DB_USERNAME:-notifications}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: array
    NOTIFICATION_PROVIDER_URL: ${NOTIFICATION_PROVIDER_URL:-}
    # Real-time updates (Laravel Reverb). Local-development credentials.
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
    REVERB_APP_ID: eda-local
    REVERB_APP_KEY: eda-local-key
    REVERB_APP_SECRET: eda-local-secret
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_PUBLIC_PORT: ${REVERB_PUBLIC_PORT:-8085}
    # Distributed tracing (OpenTelemetry → Jaeger)
    OTEL_ENABLED: ${OTEL_ENABLED:-true}
    OTEL_SERVICE_NAME: eda-notification-system
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    NOTIFICATION_RATE_LIMIT_PER_SECOND: ${NOTIFICATION_RATE_LIMIT_PER_SECOND:-100}
    NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    NOTIFICATION_RETRY_BASE_DELAY: ${NOTIFICATION_RETRY_BASE_DELAY:-10}
    NOTIFICATION_CB_THRESHOLD: ${NOTIFICATION_CB_THRESHOLD:-10}
    NOTIFICATION_CB_COOLDOWN: ${NOTIFICATION_CB_COOLDOWN:-30}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  worker:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    # Higher-priority queues are always drained first.
    command: ["php", "artisan", "queue:work", "redis", "--queue=high,normal,low", "--sleep=1", "--max-time=3600"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  # WebSocket server: clients subscribe to notifications.{id} / batches.{id}
  reverb:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PUBLIC_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Trace UI: http://localhost:16686 (OTLP/HTTP receiver on 4318)
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-notifications}
      POSTGRES_USER: ${DB_USERNAME:-notifications}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so queued jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional local provider for load / failure testing (no request quota):
  #   make up-mock    (or: NOTIFICATION_PROVIDER_URL=http://mock-provider:8000/notify docker compose --profile mock up -d)
  mock-provider:
    image: php:8.4-cli-alpine
    profiles: ["mock"]
    restart: unless-stopped
    command: ["php", "-S", "0.0.0.0:8000", "/mock/server.php"]
    environment:
      PHP_CLI_SERVER_WORKERS: 16
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0}
      MOCK_RATE_LIMIT_RATE: ${MOCK_RATE_LIMIT_RATE:-0}
      MOCK_TIMEOUT_RATE: ${MOCK_TIMEOUT_RATE:-0}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-20-80}
    volumes:
      - ./docker/mock-provider:/mock:ro
    ports:
      - "${MOCK_PORT:-8090}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health') ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
