<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background (keeps the diagram readable in GitHub dark mode) -->
  <rect width="960" height="420" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="none" stroke="#e2e8f0"/>

  <!-- Client -->
  <g filter="url(#shadow)">
    <rect x="28" y="168" width="120" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <text x="88" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Client</text>
  <text x="88" y="216" text-anchor="middle" font-size="12" fill="#64748b">REST / JSON</text>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="200" y="140" width="170" height="120" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  </g>
  <text x="285" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#9a3412">Laravel API</text>
  <text x="285" y="192" text-anchor="middle" font-size="12" fill="#7c2d12">validation</text>
  <text x="285" y="210" text-anchor="middle" font-size="12" fill="#7c2d12">idempotency</text>
  <text x="285" y="228" text-anchor="middle" font-size="12" fill="#7c2d12">correlation id</text>
  <text x="285" y="248" text-anchor="middle" font-size="11" fill="#c2410c">202 Accepted</text>

  <!-- PostgreSQL -->
  <g filter="url(#shadow)">
    <rect x="200" y="318" width="170" height="70" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
  </g>
  <text x="285" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">PostgreSQL</text>
  <text x="285" y="366" text-anchor="middle" font-size="12" fill="#1e40af">notifications · attempts</text>

  <!-- Redis -->
  <g filter="url(#shadow)">
    <rect x="430" y="110" width="190" height="180" rx="12" fill="#fef2f2" stroke="#f87171"/>
  </g>
  <text x="525" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#991b1b">Redis</text>
  <rect x="448" y="152" width="154" height="26" rx="6" fill="#fee2e2"/>
  <text x="525" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">queue: high</text>
  <rect x="448" y="184" width="154" height="26" rx="6" fill="#fee2e2"/>
  <text x="525" y="202" text-anchor="middle" font-size="12" fill="#991b1b">queue: normal</text>
  <rect x="448" y="216" width="154" height="26" rx="6" fill="#fee2e2"/>
  <text x="525" y="234" text-anchor="middle" font-size="12" fill="#991b1b">queue: low</text>
  <text x="525" y="264" text-anchor="middle" font-size="11" fill="#b91c1c">rate limit 100/s · circuit breaker</text>

  <!-- Workers -->
  <g filter="url(#shadow)">
    <rect x="690" y="132" width="110" height="136" rx="12" fill="#f0fdf4" stroke="#4ade80"/>
  </g>
  <text x="745" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">Workers</text>
  <text x="745" y="180" text-anchor="middle" font-size="12" fill="#166534">× N</text>
  <text x="745" y="206" text-anchor="middle" font-size="12" fill="#166534">claim</text>
  <text x="745" y="224" text-anchor="middle" font-size="12" fill="#166534">send</text>
  <text x="745" y="242" text-anchor="middle" font-size="12" fill="#166534">retry · backoff</text>

  <!-- Provider -->
  <g filter="url(#shadow)">
    <rect x="836" y="168" width="110" height="64" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
  </g>
  <text x="891" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#4c1d95">Provider</text>
  <text x="891" y="216" text-anchor="middle" font-size="10" fill="#6d28d9">SMS · Email · Push</text>

  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect x="660" y="318" width="170" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/>
  </g>
  <text x="745" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Scheduler</text>
  <text x="745" y="366" text-anchor="middle" font-size="12" fill="#475569">recovery sweep · 1 min</text>

  <!-- arrows -->
  <line x1="148" y1="200" x2="196" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="285" y1="260" x2="285" y2="314" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="293" y="292" font-size="11" fill="#64748b">store</text>
  <line x1="370" y1="200" x2="426" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="398" y="190" text-anchor="middle" font-size="11" fill="#64748b">event</text>
  <line x1="620" y1="200" x2="686" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="800" y1="200" x2="832" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M745 268 C 745 300, 560 300, 374 350" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="580" y="330" text-anchor="middle" font-size="11" fill="#64748b">status · attempts</text>
  <line x1="660" y1="362" x2="374" y2="362" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="517" y="378" text-anchor="middle" font-size="11" fill="#64748b">re-queue stuck</text>

  <!-- title -->
  <text x="28" y="44" font-size="20" font-weight="700" fill="#0f172a">EDA Notification System</text>
  <text x="28" y="68" font-size="13" fill="#64748b">accept fast → queue by priority → deliver at a controlled rate → retry until it lands</text>
</svg>
