server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 10m;

    # Resolve "app" through Docker's DNS at request time (cached 10 s), so recreating the
    # app container (new IP) does not leave nginx pointing at a dead address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    set $reverb_upstream reverb:8080;

    # Reverb (Pusher protocol): WebSocket connections on /app/{key}, HTTP API on /apps/{id}.
    # Lets browsers reach real-time updates on the same domain and port, e.g. behind TLS.
    location ~ ^/apps?/ {
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The service is API-only: every request is handled by Laravel's front controller.
    location / {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }
}
