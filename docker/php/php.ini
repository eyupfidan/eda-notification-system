memory_limit = 256M
expose_php = Off
max_execution_time = 60
date.timezone = UTC

; Code coverage driver: off by default, enabled only by `make coverage`
pcov.enabled = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
