# Production stack for Dokploy (service type "Docker Compose", Compose Path: ./docker-compose.dokploy.yml).
#
# - No host ports: attach a domain to the `nginx` service (port 80) in Dokploy; Traefik terminates TLS.
#   nginx also proxies the WebSocket paths (/app, /apps) to Reverb, so one domain serves everything.
# - Secrets come from Dokploy's Environment tab; deploys fail fast when a required one is missing.
#   Generate APP_KEY with: echo "base64:$(openssl rand -base64 32)"
# - Optional: a domain on `jaeger` (port 16686) exposes the trace UI. It has no authentication.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: eda-notification-system:production
  restart: unless-stopped
  environment: &app-env
    APP_NAME: "EDA Notification System"
    APP_ENV: production
    APP_KEY: ${APP_KEY:?Set APP_KEY in Dokploy (base64:...)}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL:?Set APP_URL in Dokploy (https://your-domain)}
    LOG_CHANNEL: stderr
    LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-notifications}
    DB_USERNAME: ${DB_USERNAME:-notifications}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    SESSION_DRIVER: array
    NOTIFICATION_PROVIDER_URL: ${NOTIFICATION_PROVIDER_URL:?Set NOTIFICATION_PROVIDER_URL in Dokploy (your webhook.site URL)}
    # Real-time updates (Laravel Reverb). The server talks to Reverb inside the network;
    # browsers reach it through nginx on the public domain (REVERB_PUBLIC_PORT, 443 behind Traefik).
    BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
    REVERB_APP_ID: ${REVERB_APP_ID:-eda}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?Set REVERB_APP_KEY in Dokploy}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in Dokploy}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_PUBLIC_PORT: ${REVERB_PUBLIC_PORT:-443}
    OTEL_ENABLED: ${OTEL_ENABLED:-true}
    OTEL_SERVICE_NAME: eda-notification-system
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    NOTIFICATION_RATE_LIMIT_PER_SECOND: ${NOTIFICATION_RATE_LIMIT_PER_SECOND:-100}
    NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
    NOTIFICATION_RETRY_BASE_DELAY: ${NOTIFICATION_RETRY_BASE_DELAY:-10}
    NOTIFICATION_CB_THRESHOLD: ${NOTIFICATION_CB_THRESHOLD:-10}
    NOTIFICATION_CB_COOLDOWN: ${NOTIFICATION_CB_COOLDOWN:-30}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Public entry point: give this service the domain in Dokploy (container port 80).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  worker:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "redis", "--queue=high,normal,low", "--sleep=1", "--max-time=3600"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  reverb:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/jaeger:2.11.0
    restart: unless-stopped
    expose:
      - "16686"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-notifications}
      POSTGRES_USER: ${DB_USERNAME:-notifications}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
